name: Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "VPS_SSH_KEY is empty."
            exit 1
          fi
          printf '%b' "$VPS_SSH_KEY" > /tmp/vps_ssh_key
          chmod 600 /tmp/vps_ssh_key

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ubuntu
          key_path: /tmp/vps_ssh_key
          script: |
            /opt/platform/deploy.sh my-portfolio
